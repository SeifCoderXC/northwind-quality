<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Checkout</title>
  </head>
  <body>
    <h1>Checkout</h1>
    <p>Total <strong>$48.00</strong></p>
    <button type="button" id="place">Place order</button>
    <p id="result"></p>
    <script>
      document.getElementById("place").addEventListener("click", () => {
        document.getElementById("result").textContent = "Order confirmed";
      });
    </script>
  </body>
</html>
